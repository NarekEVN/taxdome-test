x-app: &app
  build: .
  environment:
    DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}}
    # 2 instances x 2 workers x (5 + 5) = 40 connections, well under Postgres' default max_connections of 100.
    DB_POOL_SIZE: 5
    DB_MAX_OVERFLOW: 5
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      # Init scripts run in filename order, only when the data volume is empty.
      # After editing them: docker compose down -v
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during init the temporary server listens on the socket only,
      # so a socket check would report healthy before the seed has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  app1:
    <<: *app
    hostname: app1

  app2:
    <<: *app
    hostname: app2

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  pgdata:
